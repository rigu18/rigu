<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPV Festa Major</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="header-content">
                <h1>🍻 TPV Festa Major</h1>
                <div class="user-info">
                    <span id="userEmail"></span>
                    <button id="logoutBtn" class="btn-logout">🚪 Sortir</button>
                </div>
            </div>
        </header>

        <!-- Main Menu -->
        <main>
            <div class="menu-grid">
                <div class="menu-card" onclick="window.location.href='pages/sale.html'">
                    <div class="menu-icon">💰</div>
                    <h2>Venda</h2>
                    <p>Gestiona les vendes del dia</p>
                </div>
                
                <div class="menu-card" onclick="window.location.href='pages/products.html'">
                    <div class="menu-icon">📦</div>
                    <h2>Productes</h2>
                    <p>Gestiona l'inventari</p>
                </div>
                
                <div class="menu-card" onclick="window.location.href='pages/categories.html'">
                    <div class="menu-icon">🏷️</div>
                    <h2>Apartats</h2>
                    <p>Gestiona categories</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { auth } from '../js/firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

        // Verificar autenticació
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('userEmail').textContent = user.email;
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
