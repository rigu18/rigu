<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productes - TPV Festa</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <h1>📦 Gestió de Productes</h1>
                <div>
                    <a href="../index.html" class="btn-back">← Tornar</a>
                </div>
            </div>
        </header>

        <main>
            <div class="page-header">
                <h2>Llista de productes</h2>
                <button class="btn-add" onclick="openProductModal()">+ Nou Producte</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Preu (€)</th>
                            <th>Apartats</th>
                            <th>Accions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <!-- Es carrega dinàmicament -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal per crear/editar producte -->
    <div class="modal-overlay" id="productModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Nou Producte</h2>
                <button class="modal-close" onclick="closeProductModal()">×</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                
                <div class="form-group">
                    <label>Nom del producte *</label>
                    <input type="text" id="productName" required>
                </div>
                
                <div class="form-group">
                    <label>Preu (€) *</label>
                    <input type="number" id="productPrice" step="0.01" min="0" required>
                </div>
                
                <div class="form-group">
                    <label>Apartats *</label>
                    <select id="productCategories" multiple style="height:100px;">
                        <!-- Es carreguen dinàmicament -->
                    </select>
                    <small>Mantén CTRL per seleccionar múltiples apartats</small>
                </div>
                
                <button type="submit" class="btn-save">Guardar Producte</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { db } from '../js/firebase-config.js';
        import { 
            collection, getDocs, addDoc, updateDoc, deleteDoc, doc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { auth } from '../js/firebase-config.js';

        // Verificar autenticació
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = '../login.html';
        });

        // Carregar productes en temps real
        const productsRef = collection(db, 'products');
        const categoriesRef = collection(db, 'categories');

        // Carregar productes
        function loadProducts() {
            onSnapshot(productsRef, (snapshot) => {
                const tbody = document.getElementById('productsTableBody');
                tbody.innerHTML = '';
                
                snapshot.forEach((doc) => {
                    const product = { id: doc.id, ...doc.data() };
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${product.name}</td>
                        <td>${product.price.toFixed(2)}€</td>
                        <td>${product.categories ? product.categories.join(', ') : 'Sense apartat'}</td>
                        <td>
                            <button class="btn-edit" onclick="editProduct('${product.id}')">✏️ Editar</button>
                            <button class="btn-delete" onclick="deleteProduct('${product.id}')">🗑️ Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            });
        }

        // Carregar categories pel desplegable
        async function loadCategoriesSelect() {
            const select = document.getElementById('productCategories');
            select.innerHTML = '';
            
            const snapshot = await getDocs(categoriesRef);
            snapshot.forEach((doc) => {
                const category = doc.data();
                const option = document.createElement('option');
                option.value = doc.id;
                option.textContent = category.name;
                select.appendChild(option);
            });
        }

        // Obrir modal per crear producte
        window.openProductModal = function() {
            document.getElementById('modalTitle').textContent = 'Nou Producte';
            document.getElementById('productId').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productCategories').selectedIndex = -1;
            document.getElementById('productModal').classList.add('active');
            loadCategoriesSelect();
        };

        // Tancar modal
        window.closeProductModal = function() {
            document.getElementById('productModal').classList.remove('active');
        };

        // Editar producte
        window.editProduct = async function(id) {
            const docRef = doc(db, 'products', id);
            const docSnap = await getDoc(docRef);
            
            if (docSnap.exists()) {
                const product = docSnap.data();
                document.getElementById('modalTitle').textContent = 'Editar Producte';
                document.getElementById('productId').value = id;
                document.getElementById('productName').value = product.name;
                document.getElementById('productPrice').value = product.price;
                
                await loadCategoriesSelect();
                const select = document.getElementById('productCategories');
                Array.from(select.options).forEach(option => {
                    if (product.categories && product.categories.includes(option.value)) {
                        option.selected = true;
                    }
                });
                
                document.getElementById('productModal').classList.add('active');
            }
        };

        // Eliminar producte
        window.deleteProduct = async function(id) {
            if (confirm('Segur que vols eliminar aquest producte?')) {
                await deleteDoc(doc(db, 'products', id));
            }
        };

        // Guardar producte (crear/editar)
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('productId').value;
            const name = document.getElementById('productName').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const select = document.getElementById('productCategories');
            const categories = Array.from(select.selectedOptions).map(opt => opt.value);
            
            const data = { name, price, categories };
            
            try {
                if (id) {
                    await updateDoc(doc(db, 'products', id), data);
                } else {
                    await addDoc(collection(db, 'products'), data);
                }
                closeProductModal();
            } catch (error) {
                alert('Error al guardar: ' + error.message);
            }
        });

        // Iniciar
        loadProducts();

        // Tancar modal amb click fora
        document.getElementById('productModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeProductModal();
        });
    </script>
</body>
</html>
