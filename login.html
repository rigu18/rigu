<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPV Festa Major - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>🍻 TPV Festa Major</h1>
            <h2>Inicia sessió</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correu electrònic</label>
                    <input type="email" id="email" placeholder="admin@festa.cat" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Contrasenya</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn-primary">Entrar</button>
                
                <div id="errorMessage" class="error-message" style="display:none;"></div>
            </form>
        </div>
    </div>

    <script type="module">
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { auth } from './js/firebase-config.js';

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                window.location.href = 'index.html';
            } catch (error) {
                errorMessage.style.display = 'block';
                errorMessage.textContent = '❌ ' + getErrorMessage(error.code);
            }
        });

        function getErrorMessage(code) {
            const errors = {
                'auth/user-not-found': 'Usuari no trobat',
                'auth/wrong-password': 'Contrasenya incorrecta',
                'auth/invalid-email': 'Correu electrònic invàlid',
                'auth/user-disabled': 'Usuari desactivat',
                'auth/too-many-requests': 'Massos intents. Torna a provar més tard'
            };
            return errors[code] || 'Error desconegut. Torna a provar';
        }
    </script>
</body>
</html>
